async def fetch_with_retry(

) -> dict:

    # Ghi vàở temp file cung thu muc (cung filesystem = rename atomic)
    with tempfile.NamedTemporaryFile(
        mode="w",
        dir=path.parent,
        suffix=".tmp",
        delete=False,
        encoding="utf-8",
    ) as tmp:
        json.dump(data, tmp, ensure_ascii=False, indent=2)
        tmp.flush()
        os.fsync(tmp.fileno())  # flush OS buffer xuong disk
        tmp_path = tmp.name

    # atomic rename: không có trạng thái "nua với"
    os.replace(tmp_path, path)

# Async version
async def atomic_write_json_async(path, data):
    import aiofiles
    tmp_path = str(path) + ".tmp"
    async with aiofiles.open(tmp_path, "w") as f:
        await f.write(json.dumps(data, ensure_ascii=False, indent=2))
    os.replace(tmp_path, path)`,
      note: "Dac biết quan trọng với checkpoint file trong training. os.replace() là atomic trên cung filesystem -- nếu crash giua chung, file cu vẫn còn nguyên.",
    },
  ],
},
];
