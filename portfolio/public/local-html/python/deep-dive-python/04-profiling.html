function BlockingDetectorSection() {
  return (
    <section className="bg-slate-50 px-6 py-16">
      <SectionTitle eyebrow="Tool 4" title="Tự động phát hiện blocking calls" icon={Timer}>
        Decorator này canh bao khi một async function chỉem event loop qua lâu -- không cần profiler, chỉ cần thêm 1 dòng.
      </SectionTitle>
      <div className="mx-auto grid max-w-6xl gap-6 lg:grid-cols-2">
        <div className="rounded-[2rem] border bg-white p-6 shadow-xl">
          <h3 className="mb-4 font-black text-slate-950">Decorator detect_blocking</h3>
          <CodeBlock>{`import asyncio, functools, logging

logger = logging.getLogger(__name__)

def detect_blocking(threshold_ms: float = 50):
    """Warn nếu async function chỉem event loop > threshold_ms."""
    def decorator(func):
        @functools.wraps(func)
        async def wrapper(*args, **kwargs):
            loop = asyncio.get_running_loop()
            t0 = loop.time()
            result = await func(*args, **kwargs)
            elapsed = (loop.time() - t0) * 1000
            if elapsed > threshold_ms:
                logger.warning(
                    f"[BLOCKING] {func.__name__} "
                    f"took {elapsed:.1f}ms "
                    f"(threshold: {threshold_ms}ms)"
                )
            return result
        return wrapper
    return decorator`}</CodeBlock>
        </div>
        <div className="flex flex-col gap-4">
          <div className="rounded-[2rem] border bg-white p-6 shadow-xl">
            <h3 className="mb-4 font-black text-slate-950">Ví dụ su dùng</h3>
            <CodeBlock>{`# Danh dau hàm nghi ngo:
@detect_blocking(threshold_ms=100)
async def handler(request):
    # Bug: requests.get là blocking!
    data = requests.get(url).json()
    return data
# -> WARNING: handler took 234.5ms (threshold: 100ms)

# Dùng chờ toan bo endpoint trong FastAPI:
from fastapi import FastAPI
app = FastAPI()

@app.middleware("http")
async def detect_slow_handlers(request, call_next):
    import time
    start = time.monotonic()
    response = await call_next(request)
    elapsed = (time.monotonic() - start) * 1000
    if elapsed > 200:
        logger.warning(f"Slow: {request.url} {elapsed:.0f}ms")
    return response`}</CodeBlock>
          </div>
          <div className="rounded-2xl border border-amber-200 bg-amber-50 p-4 text-amber-900">
            <b>Luu y:</b> elapsed time đó ở đây là wall time ke từ lúc hàm bắt đầu den lúc return. Nếu có nhiều await bên trong, phan lớn là thời gian chờ I/Ở -- không phải blocking. Chỉ canh bao khi có <b>sync blocking call</b> thật sự như requests.get, time.sleep, open() với file lớn.
          </div>
        </div>
      </div>

}

function SigUsr1Section() {
  return (
    <section className="px-6 py-16 bg-white">
      <SectionTitle eyebrow="Tool 5" title="SIGUSR1 Task Dump — Debug On-Demand" icon={HelpCircle}>
        Dump trạng thái task bất cứ lúc nàở bang kill -USR1, không cần restart app, không ảnh hưởng request đang chạy.
      </SectionTitle>
      <div className="mx-auto max-w-4xl">
        <CodeBlock>{`import asyncio, signal, logging, sys, os

logger = logging.getLogger(__name__)

async def dump_tasks():
    """In stack trace của tất cả tasks đang chạy."""
    tasks = asyncio.all_tasks()
    logger.info(f"=== Task Dump: {len(tasks)} tasks ===")
    for i, task in enumerate(tasks):
        logger.info(f"\\nTask {i+1}: {task.get_name()}")
        logger.info(f"  Done: {task.done()}")
        if not task.done():
            # In stack trace của task
            frames = []
            coro = task.get_coro()
            while coro is not None and hasattr(coro, 'cr_frame') and coro.cr_frame is not None:
                frame = coro.cr_frame
                frames.append(
                    f"  {frame.f_code.co_filename}:{frame.f_lineno} "
                    f"in {frame.f_code.co_name}"
                )
                coro = coro.cr_await if hasattr(coro, 'cr_await') else None
            logger.info("\\n".join(frames))

def setup_debug_signal():
    """Đang ky SIGUSR1 handler để dump tasks theo yeu câu."""
    def handler(signum, frame):
        asyncio.create_task(dump_tasks())

    # Chỉ hoạt động trên Unix/macOS
    if sys.platform != "win32":
        signal.signal(signal.SIGUSR1, handler)
        logger.info(f"Debug handler ready. Run: kill -USR1 {os.getpid()}")

# Gọi khi khởi động app:
setup_debug_signal()

# Khi cần debug:
# kill -USR1 <pid>   <- Unix/macOS
# -> log ra stack trace của mỗi task ngay lập tức`}</CodeBlock>
        <div className="mt-4 rounded-2xl border border-violet-200 bg-violet-50 p-4 text-violet-900">
          <b>Pattern này rất hữu ích trong production:</b> Khi app có request bi hang (timeout nhưng process vẫn chạy), kill -USR1 để thấy đang task nàở đang await gì mà không cần restart hay attach debugger.

}

                <th className="p-4 font-black">Production?</th>
              </tr>
            </thead>
            <tbody>
              {tools.map((t, i) => (
                <tr key={t.name} className={i % 2 ? "bg-white/5" : "bg-white/0"}>
                  <td className="p-4 font-black text-white">{t.name}</td>
                  <td className="p-4 font-mono text-slate-400 text-xs">{t.install}</td>
                  <td className="p-4 text-slate-300">{t.when}</td>

            </tbody>
          </table>
        </div>
      </div>
    </section>
  );
