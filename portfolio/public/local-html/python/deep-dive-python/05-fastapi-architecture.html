function WorkerPoolSection() {
  return (
    <section className="px-6 py-16 bg-white">
      <SectionTitle eyebrow="Pattern 3" title="WorkerPool — asyncio.Queue Với Backpressure" icon={Database}>
        Khi cần process queue lien tuc, kiểm soát concurrency, và graceful shutdown — không muốn overhead Celery.
      </SectionTitle>
      <div className="mx-auto max-w-4xl">
        <CodeBlock>{`import asyncio
from typing import Any, Callable, Awaitable
import logging

logger = logging.getLogger(__name__)

class AsyncWorkerPool:
    """
    Worker pool dua trên asyncio.Queue.
    - Backpressure: producer bi block khi queue đây
    - Graceful shutdown: chờ het queue rồi mới stop
    - Stats: theo dõi processed/errors
    """
    def __init__(self, n_workers: int = 10, queue_size: int = 1000):
        self.queue: asyncio.Queue = asyncio.Queue(maxsize=queue_size)
        self.n_workers = n_workers
        self._workers: list[asyncio.Task] = []
        self._processed = 0
        self._errors = 0
        self._running = False

    async def start(self) -> None:
        self._running = True
        self._workers = [
            asyncio.create_task(
                self._worker(i),
                name=f"worker-{i}"
            )
            for i in range(self.n_workers)
        ]
        logger.info(f"WorkerPool started: {self.n_workers} workers")

    async def submit(self, coro_fn: Callable, *args, **kwargs) -> None:
        """Submit job. Block nếu queue đây (backpressure)."""
        await self.queue.put((coro_fn, args, kwargs))

    async def _worker(self, worker_id: int) -> None:
        while self._running or not self.queue.empty():
            try:
                item = await asyncio.wait_for(
                    self.queue.get(),
                    timeout=1.0
                )
            except asyncio.TimeoutError:
                continue
            coro_fn, args, kwargs = item
            try:
                await coro_fn(*args, **kwargs)
                self._processed += 1
            except Exception as e:
                self._errors += 1
                logger.error(f"worker-{worker_id} error: {e}")
            finally:
                self.queue.task_done()

    async def shutdown(self, timeout: float = 30.0) -> None:
        """Doi het queue rồi dùng. Timeout sau 'timeout' giay."""
        self._running = False
        try:
            await asyncio.wait_for(self.queue.join(), timeout=timeout)
        except asyncio.TimeoutError:
            logger.warning(f"Shutdown timeout after {timeout}s")
        for w in self._workers:
            w.cancel()
        await asyncio.gather(*self._workers, return_exceptions=True)
        logger.info(f"WorkerPool stopped. Processed: {self._processed}, Errors: {self._errors}")

    def stats(self) -> dict:
        return {
            "queue_size": self.queue.qsize(),
            "processed": self._processed,
            "errors": self._errors,
            "workers": self.n_workers,
        }

# Dùng với FastAPI:
@asynccontextmanager
async def lifespan(app: FastAPI):
    app.state.pool = AsyncWorkerPool(n_workers=10, queue_size=500)
    await app.state.pool.start()
    yield
    await app.state.pool.shutdown()

@app.post("/eval/pool")
async def eval_via_pool(request: Request, case: EvalCase):
    await request.app.state.pool.submit(run_eval, case)
    return {"status": "queued"}

@app.get("/pool/stats")
async def pool_stats(request: Request):
    return request.app.state.pool.stats()`}</CodeBlock>

      <div className="mx-auto max-w-4xl">
        <CodeBlock>{`from fastapi import FastAPI, Depends, Request
from typing import Annotated, AsyncGenerator
import asyncpg, httpx

app = FastAPI()

# === DEPENDENCY: DB connection từ pool ===
async def get_db(request: Request) -> AsyncGenerator[asyncpg.Connection, None]:
    """Lay connection từ pool, tra lại sau khi xong."""
    conn = await request.app.state.db_pool.acquire()
    try:
        yield conn
    finally:
        await request.app.state.db_pool.release(conn)

# === DEPENDENCY: HTTP client từ app.state ===
async def get_http_client(request: Request) -> httpx.AsyncClient:
    return request.app.state.http_client

# === DEPENDENCY: Kiểm tra auth ===
async def require_api_key(x_api_key: str = Header(None)) -> str:
    if x_api_key != settings.API_KEY:
        raise HTTPException(status_code=401, detail="Invalid API key")
    return x_api_key

# === Type aliases chờ sạch hơn ===
DbConn = Annotated[asyncpg.Connection, Depends(get_db)]
HttpClient = Annotated[httpx.AsyncClient, Depends(get_http_client)]
AuthKey = Annotated[str, Depends(require_api_key)]

# === Endpoint dùng dependency ===
@app.post("/eval")
async def evaluate(
    case: EvalCase,
    db: DbConn,          # tự động acquire + release
    client: HttpClient,  # tự động lay từ app.state
    _: AuthKey,          # tự động check auth
):
    # Gọi LLM
    llm_result = await call_llm(client, case)
    # Luu vàở DB
    await db.execute(
        "INSERT INTO results(case_id, result) VALUES($1, $2)",
        case.id, llm_result
    )
    return llm_result`}</CodeBlock>

function GracefulShutdownSection() {

      <div className="mx-auto max-w-4xl">
        <CodeBlock>{`import asyncio, signal, time
from fastapi import FastAPI, Request, Response
from starlette.middleware.base import BaseHTTPMiddleware

class ShutdownMiddleware(BaseHTTPMiddleware):
    """Track active requests, từ chời request mới khi đang shutdown."""
    def __init__(self, app):
        super().__init__(app)
        self._active = 0
        self._shutting_down = False

    async def dispatch(self, request: Request, call_next):
        if self._shutting_down:
            return Response(
                status_code=503,
                content="Server shutting down"
            )
        self._active += 1
        try:
            return await call_next(request)
        finally:
            self._active -= 1

    async def shutdown(self, timeout: float = 30.0):
        self._shutting_down = True
        deadline = asyncio.get_event_loop().time() + timeout
        while self._active > 0:
            if asyncio.get_event_loop().time() > deadline:
                break
            await asyncio.sleep(0.1)

shutdown_middleware = ShutdownMiddleware(None)  # init sau

@asynccontextmanager
async def lifespan(app: FastAPI):
    yield
    # SIGTERM handler: drain requests trước khi đóng
    await shutdown_middleware.shutdown(timeout=30)

app = FastAPI(lifespan=lifespan)
app.add_middleware(ShutdownMiddleware)

# Health check chờ load balầncer / Kubernetes
@app.get("/health")
async def health(request: Request):
    pool_stats = request.app.state.pool.stats()
    return {
        "status": "ok",
        "timestamp": time.time(),
        "active_requests": shutdown_middleware._active,
        "worker_queue": pool_stats["queue_size"],
        "workers_processed": pool_stats["processed"],
    }

# Readiness check: sẵn sàng nhận traffic chua?
@app.get("/ready")
async def ready(request: Request):
    if not hasattr(request.app.state, "db_pool"):
        return Response(status_code=503, content="DB not ready")
    return {"ready": True}`}</CodeBlock>

async def get_users_compat():
    def sync_query():
        with psycopg2.connect(DATABASE_URL) as conn:
            return conn.execute("SELECT * FROM users").fetchall()
    return await asyncio.to_thread(sync_query)`,
      note: "asyncpg, databases, SQLAlchemy async mode, tortoise-orm là các lua chọn async. Nếu phải dùng sync driver: asyncio.to_thread().",
    },
    {
      title: "asyncio.run() bên trong endpoint",
      bad: `@app.get("/data")
async def get_data():
    # BUG: asyncio.run() tạở event loop mới
    # -> Crash vi đã có loop đang chạy (FastAPI's loop)
    result = asyncio.run(fetch_something())
    return result
# Lỗi: RuntimeError: Thìs event loop is already running`,
      good: `@app.get("/data")
async def get_data():
    # DUNG: await trực tiếp - dùng loop đang chạy
    result = await fetch_something()
    return result

# Hoac nếu fetch_something là sync:
@app.get("/data")
async def get_data():
    result = await asyncio.to_thread(sync_fetch_something)
    return result`,
      note: "asyncio.run() tạở loop mới. Trong FastAPI (đã có loop), dùng nó sẽ crash. Luôn dùng await trực tiếp hoặc asyncio.to_thread chờ sync code.",
    },
    {
      title: "BackgroundTasks chờ job dài hoặc cần retry",
      bad: `@app.post("/train")
async def start_training(job: TrainingJob, bg: BackgroundTasks):
    # BUG: training có thể mất 2 gio
    # -> Process crash = mất job, không retry
    # -> Không monitor được progress
    bg.add_task(run_training, job)
    return {"status": "started"}`,
      good: `from celery import Celery
celery = Celery(broker="redis://localhost")

@celery.task(bind=True, max_retries=3)
def training_task(self, job_dict):
    try:
        return run_training(TrainingJob(**job_dict))
    except Exception as exc:
        raise self.retry(exc=exc, countdown=60)

@app.post("/train")
async def start_training(job: TrainingJob):
    task = await asyncio.to_thread(
        training_task.delay, job.dict()
    )
    return {"task_id": task.id, "status": "queued"}

@app.get("/train/{task_id}")
async def training_status(task_id: str):
    result = celery.AsyncResult(task_id)
    return {"status": result.status}`,
      note: "BackgroundTasks chạy trong cung process, cung thread pool, cung lifecycle. Job dài/quan trọng = Celery để có retry, monitor, và scale worker riêng.",
    },
  ];

  return (
    <section className="bg-slate-950 px-6 py-16 text-white">
