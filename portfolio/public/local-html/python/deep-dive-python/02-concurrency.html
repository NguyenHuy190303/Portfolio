# QUAN TRONG: semaphore kiểm soát concurrent requests
sem = asyncio.Semaphore(20)  # max 20 đồng thời

async def eval_case(client: httpx.AsyncClient, case: dict):
    async with sem:  # block nếu đang có 20 task
        r = await client.post(LLM_URL, json=case, timeout=30)
        r.raise_for_status()
        return score(r.json())

async def main(cases):
    # 1 client, tái dùng connection pool
    async with httpx.AsyncClient() as client:
        return await asyncio.gather(
            *[eval_case(client, c) for c in cases]
        )

results = asyncio.run(main(cases))
# 300 cases x 2s latency -> ~2-3s tổng (không phải 600s)`,
gotcha: "Semaphore là bắt buộc. gather(1000 tasks) mà không có semaphore = spam 1000 requests cùng lúc -> rate limit 429 hoặc crash server. Luôn tạở 1 AsyncClient dùng lại, không tạở mới mỗi request.",
notFor: "CPU-bound Python thuần (loop nặng, NLP parsing, regex phức tạp) - async không gìúp gì, thậm chí chậm hơn sync vi overhead event loop.",
},
{
name: "Threading",
kid: "Nhiều ban cung ngồi trong một phòng, chia nhau việc chờ.",
best: "Library sync/blocking không có async version: requests, boto3, psycopg2, SDK cu.",
cpu: "Yếu với Python bytecode thuần đó GIL",

med: "Dùng SDK sync để gọi LLM song song.",
code: `from concurrent.futures import ThreadPoolExecutor
import requests, os

def eval_case(case: dict) -> dict:

# Python 3.8+ default: min(32, cpu_count + 4)
# Với I/Ở-bound có thể đặt cao hơn so core
with ThreadPoolExecutor(max_workers=16) as pool:
    results = list(pool.map(eval_case, cases))

    return await asyncio.to_thread(eval_case, case)`,
gotcha: "ThreadPoolExecutor là cach nhanh nhất chạy song song sync library mà không đổi stack. Dùng khi ban không thể/không muốn chuyển sang async. asyncio.to_thread() (Python 3.9+) gìúp mix với async context.",
notFor: "CPU-heavy Python loop - 8 thread không chạy nhanh gấp 8 lần vi GIL. Dùng ProcessPoolExecutor thay thế.",
},
{
name: "Multiprocessing",
kid: "Nhiều phòng riêng, mỗi phòng có một bạn và một bộ đồ dùng riêng.",
best: "CPU-bound: scoring nặng, NLP/regex parsing lớn, local inference CPU.",
cpu: "Có - parallel CPU thật, mỗi process có GIL riêng",
risk: "Tốn RAM (copy process), phải pickle data qua IPC, startup overhead ~100-200ms/process.",
med: "Chậm metric CPU-heavy.",
code: `from concurrent.futures import ProcessPoolExecutor
import os

def heavy_score(case: dict) -> float:
    # CPU-heavy: BLEU, ROUGE, regex, local NLP model
    return compute_bleu(case) + compute_rouge(case)

n_workers = os.cpu_count()  # dùng tạở nhiều hơn core vat lý

with ProcessPoolExecutor(max_workers=n_workers) as pool:
    # chunksize: gom nhiều item/lần gửi -> giam IPC overhead
    # Rule: len(data) // (4 * cpu_count)
    chunksize = max(1, len(cases) // (4 * n_workers))
    scores = list(pool.map(heavy_score, cases, chunksize=chunksize))

# Luu y: function và args phải picklable

notFor: "I/Ở-bound hoặc task < 50ms - process startup overhead 100-200ms không xứng. Cũng không dùng được với lambda hoặc local function vì không pickle được.",
},
{
name: "Queue workers",
kid: "Một hợp thu giao bài: ai rảnh thì lay một bài ra làm.",
best: "Job production lớn, retry tự động, scale nhiều máy, GPU batch, job chạy lâu.",
cpu: "Có, tuy câu hinh worker",
risk: "Phuc tap hơn, eventual consistency, trace context phải truyền thủ công qua metadata.",
med: "Batch eval 100k cases với retry và monitoring.",
code: `# Producer: gửi job vàở queue (không block)
from celery import Celery
app = Celery(broker="redis://localhost")

@app.task(bind=True, max_retries=3, default_retry_delay=5)
def eval_case_task(self, case: dict, trace_id: str):
    try:
        return run_eval(case, trace_id=trace_id)
    except RateLimitError as exc:
        # Exponential backoff: 5s, 10s, 20s
        raise self.retry(exc=exc, countdown=5 * (2 ** self.request.retries))

# Gửi 100k jobs không block caller
for case in cases:
    eval_case_task.delay(case, trace_id=new_trace_id())

# Chạy worker riêng:
# celery -A app worker --concurrency=8 -Q eval_queue
# Có thể scale nhiều máy, GPU worker riêng, retry dashboard`,

notFor: "Script nhỏ, chạy một lần, không cần retry - overhead setup broker/worker không xứng. Cũng không hợp khi cần kết quả ngay (latency cao hơn direct call).",
},
];

async def main(urls: list[str]):

    )

try:
    async with asyncio.TaskGroup() as tg:
        t1 = tg.create_task(fetch_llm("case-1"))
        t2 = tg.create_task(fetch_llm("case-2"))

    # Tat ca task da xong khi ra khoi with block

except* ValueError as eg:
    # except* xử lý ExceptionGroup

        logger.error(f"task failed: {exc}")`,

  title: "Proper cancellation: luon re-raise CancelledError",
  tag: "Quan trong",
  why: "Bắt CancelledError mà không re-raise = task không thuc su bi cancel, gay resource leak và deadlock am tham.",
  code: `# SAI: nuot CancelledError

    try:
        await long_operation()
    except asyncio.CancelledError:
        pass  # <- task vẫn "chạy" từ goc nhìn event loop, gay leak

# DUNG: luon re-raise

    try:
        return await long_operation()
    except asyncio.CancelledError:
        await cleanup_resources()  # cleanup nếu cần
        raise  # <- BAT BUOC

async def better_task():
    try:
        return await long_operation()
    finally:
        await cleanup_resources()  # chạy du cancel hay exception`,
},
{
  title: "asyncio.Queue: backpressure producer-consumer",
  tag: "Pattern",
  why: "Khi producer nhanh hơn consumer (đọc file nhanh, gọi API chậm), cần buffer có gìới hạn để không OOM.",
  code: `import asyncio

async def producer(queue: asyncio.Queue, items):
    for item in items:
        await queue.put(item)        # block nếu queue đây
    await queue.put(None)            # sentinel bao het

async def consumer(queue: asyncio.Queue, worker_id: int):
    while True:
        item = await queue.get()
        if item is None:
            await queue.put(None)    # pass sentinel chờ worker khác
            queue.task_done()
            break
        await process(item)
        queue.task_done()

async def main(data):
    q = asyncio.Queue(maxsize=100)  # backpressure: block producer khi > 100 item
    await asyncio.gather(
        producer(q, data),
        consumer(q, 1),
        consumer(q, 2),
        consumer(q, 3),
    )`,
},
{
  title: "Rate limiter theo token bucket",
  tag: "Production",
  why: "Semaphore gìới hạn concurrent connections, token bucket gìới hạn req/second - hai thu khác nhau. Nhiều API có ca hai limit.",
  code: `import asyncio, time

class TokenBucketLimiter:
    """Gioi han requests/giay, không phải concurrent requests."""
    def __init__(self, rate: float):  # requests per second
        self._rate = rate
        self._tokens = rate
        self._updated_at = time.monotonic()
        self._lock = asyncio.Lock()

    async def acquire(self):
        async with self._lock:
            now = time.monotonic()
            # Cong token theo thời gian da qua
            self._tokens = min(
                self._rate,
                self._tokens + (now - self._updated_at) * self._rate
            )
            self._updated_at = now
            if self._tokens < 1:
                wait = (1 - self._tokens) / self._rate
                await asyncio.sleep(wait)
                self._tokens = 0
            else:
                self._tokens -= 1

llm_limiter = TokenBucketLimiter(rate=10)  # 10 req/s

async def call_llm(prompt: str):
    await llm_limiter.acquire()
    return await client.complete(prompt)`,
},

        </div>

</section>
);
}

function Quiz() {
const [answers, setAnswers] = useState({});
const score = useMemo(() => quiz.reduce((sum, q, i) => sum + (answers[i] === q.answer ? 1 : 0), 0), [answers]);

return (
<section className="bg-gradient-to-br from-indigo-50 to-cyan-50 px-6 py-16">
    <SectionTitle eyebrow="Kiểm tra hieu bài" title="Quiz nhỏ 10 câu" icon={Sparkles}>
        Chờn dap an. Sai cung không sao, máy tinh không mang ban.
    </SectionTitle>
    <div className="mx-auto max-w-5xl">
        <div className="mb-6 rounded-[2rem] border bg-white p-5 text-center shadow-xl">
            <p className="text-sm font-bold uppercase tracking-widest text-indigo-700">Điểm hiện tại</p>
            <p className="mt-1 text-4xl font-black text-slate-950">{score} / {quiz.length}</p>
        </div>
        <div className="grid gap-5">
            {quiz.map((q, i) => (
            <div key={q.question} className="rounded-[2rem] border bg-white p-6 shadow-xl">
                <h3 className="text-xl font-black text-slate-950">{i + 1}. {q.question}</h3>
                <div className="mt-4 grid gap-3 md:grid-cols-3">
                    {q.options.map((option, idx) => {
                    const chosen = answers[i] === idx;
                    const correct = q.answer === idx;
                    const revealed = answers[i] !== undefined;
                    return (
                    <button key={option} onClick={() => setAnswers((a) => ({ ...a, [i]: idx }))}
                        className={`rounded-2xl border p-4 text-left font-semibold transition ${
                        revealed && correct
                        ? "border-emerald-300 bg-emerald-50 text-emerald-950"
                        : chosen
                        ? "border-rose-300 bg-rose-50 text-rose-950"
                        : "border-slate-200 bg-slate-50 hover:bg-slate-100"
                        }`}
                        >
                        {option}
                    </button>
                    );
                    })}
                </div>
                {answers[i] !== undefined && (
                <div className="mt-4 rounded-3xl bg-slate-950 p-4 text-slate-100">
                    <b>Vi sao?</b> {q.why}
                </div>
                )}
            </div>
            ))}
        </div>
    </div>
</section>
);
}

function FinalCheatSheet() {
return (
<section className="px-6 py-16">
    <div className="mx-auto max-w-5xl rounded-[2rem] bg-slate-950 p-8 text-white shadow-2xl">
        <div className="mb-6 inline-flex items-center gap-2 rounded-full bg-white/10 px-4 py-2 text-sm font-bold text-cyan-200">
            <Sparkles size={16} /> Tom gon bo tui
        </div>
        <h2 className="text-4xl font-black">Nhớ 5 dòng này là đủ đi phỏng vấn</h2>
        <div className="mt-6 grid gap-4 md:grid-cols-2">
            <p className="rounded-3xl bg-white/10 p-5 leading-8"><b>Sync:</b> để hieu, từần tự, chờ tung việc.</p>
            <p className="rounded-3xl bg-white/10 p-5 leading-8"><b>Async:</b> một thread xử lý nhiều I/Ở bang event loop.</p>
            <p className="rounded-3xl bg-white/10 p-5 leading-8"><b>Thread:</b> hợp với blocking I/Ở, nhưng CPU Python bi GIL gìới hạn.</p>
            <p className="rounded-3xl bg-white/10 p-5 leading-8"><b>Process:</b> dùng nhiều CPU core that, nhưng overhead cao.</p>
            <p className="rounded-3xl bg-white/10 p-5 leading-8 md:col-span-2"><b>Queue workers:</b> hợp production job lớn, retry, distributed/GPU, nhưng phức tạp và cần truyền trace context.</p>
        </div>
        <div className="mt-6 rounded-3xl bg-gradient-to-r from-indigo-500 to-cyan-500 p-6">
            <p className="text-2xl font-black">Công thức AI eval thực tế:</p>
            <p className="mt-2 text-lg leading-8">HTTP endpoint nhiều case -> async. SDK sync legacy -> thread pool. Scoring/inference CPU/GPU nặng -> process/worker/queue. Tracing context -> contextvars trong async, headers qua boundary.</p>
        </div>
    </div>
</section>
);
}

  return (
    <main className="min-h-screen bg-white font-sans text-slate-900">
      <Nav />
      <Hero />
      <PythonMechanisms />

      <GILSection />

        prev="01-basics.html"
