import os

def heavy_score(case: dict) -> float:
    # CPU-heavy: BLEU, ROUGE, regex, local NLP model
    return compute_bleu(case) + compute_rouge(case)

n_workers = os.cpu_count()  # đừng tạo nhiều hơn core vật lý

with ProcessPoolExecutor(max_workers=n_workers) as pool:

@app.task(bind=True, max_retries=3, default_retry_delay=5)
def eval_case_task(self, case: dict, trace_id: str):

        # Exponential backoff: 5s, 10s, 20s

# Gửi 100k jobs không block caller

function Quiz() {
const [answers, setAnswers] = useState({});
const score = useMemo(() => quiz.reduce((sum, q, i) => sum + (answers[i] === q.answer ? 1 : 0), 0), [answers]);

return (
<section className="bg-gradient-to-br from-indigo-50 to-cyan-50 px-6 py-16">
    <SectionTitle eyebrow="Kiểm tra hiểu bài" title="Quiz nhỏ 3 câu" icon={Sparkles}>

            <p className="text-sm font-bold uppercase tracking-widest text-indigo-700">Điểm hiện tại</p>
            <p className="mt-1 text-4xl font-black text-slate-950">{score} / {quiz.length}</p>
        </div>
        <div className="grid gap-5">
            {quiz.map((q, i) => (
            <div key={q.question} className="rounded-[2rem] border bg-white p-6 shadow-xl">
                <h3 className="text-xl font-black text-slate-950">{i + 1}. {q.question}</h3>
                <div className="mt-4 grid gap-3 md:grid-cols-3">
                    {q.options.map((option, idx) => {
                    const chosen = answers[i] === idx;
                    const correct = q.answer === idx;
                    const revealed = answers[i] !== undefined;
                    return (
                    <button key={option} onClick={()=> setAnswers((a) => ({ ...a, [i]: idx }))}
                        className={`rounded-2xl border p-4 text-left font-semibold transition ${
                        revealed && correct
                        ? "border-emerald-300 bg-emerald-50 text-emerald-950"
                        : chosen
                        ? "border-rose-300 bg-rose-50 text-rose-950"
                        : "border-slate-200 bg-slate-50 hover:bg-slate-100"
                        }`}
                        >
                        {option}
                    </button>
                    );
                    })}
                </div>
                {answers[i] !== undefined && (
                <div className="mt-4 rounded-3xl bg-slate-950 p-4 text-slate-100">
                    <b>Vì sao?</b> {q.why}
                </div>
                )}
            </div>
            ))}
        </div>
    </div>
</section>
);
}

function MythsSection() {
const myths = [
{
  myth: "Async = code chạy nhanh hơn",
  reality: "Async chỉ tránh lãng phí thời gian ngồi chờ I/O. CPU của bạn không chạy nhanh hơn một chút nào.",
  example: `# MYTH: await magic làm mọi thứ nhanh
async def bad():
    for x in data:
        result = heavy_cpu_calc(x)  # vẫn tốn CPU như thường
    # await không giúp ích gì ở đây

# REALITY: async win khi chờ network/DB
async def good():
    results = await asyncio.gather(
        *[client.get(url) for url in urls]
    )  # 100 requests, chờ network → async win rõ`,
},
{
  myth: "Thêm thread = tăng tốc Python thuần",
  reality: "GIL chỉ cho 1 thread chạy Python bytecode cùng lúc. 8 thread tính toán Python = gần bằng 1 thread, đôi khi còn chậm hơn vì lock contention.",
  example: `# MYTH: 8 thread = 8x nhanh
with ThreadPoolExecutor(8) as p:
    p.map(heavy_python_loop, data)
# Kết quả: ~1x so với single thread 😢

# REALITY: dùng process cho CPU-bound
with ProcessPoolExecutor(8) as p:
    p.map(heavy_python_loop, data)
# Kết quả: ~7-8x nhanh hơn ✓

# Ngoại lệ: NumPy/PyTorch release GIL → thread OK`,
},
{
  myth: "asyncio là multi-threaded",
  reality: "Asyncio chạy trên 1 thread duy nhất. Các coroutine xen kẽ nhau theo cooperative scheduling — không phải parallel thật.",
  example: `import asyncio, threading

async def check():
    print(threading.current_thread().name)
    await asyncio.sleep(0)  # nhường event loop
    print(threading.current_thread().name)  # vẫn cùng 1 thread!

asyncio.run(check())
# Output:
# MainThread
# MainThread  ← vẫn 1 thread!

# → Không cần lock cho shared state trong async
#   NHƯNG cẩn thận khi có await giữa read và write`,
},
{
  myth: "await làm code dừng, không làm gì",
  reality: "await suspend coroutine HIỆN TẠI và event loop chạy task khác. Chương trình không idle.",
  example: `# MYTH: trong 3s này CPU ngủ
await asyncio.sleep(3)

# REALITY: trong 3s đó:
async def main():
    await asyncio.gather(

class TokenBucketLimiter:
    """Giới hạn requests/giây, không phải concurrent requests."""
    def __init__(self, rate: float):  # requests per second
        self._rate = rate
        self._tokens = rate
        self._updated_at = time.monotonic()
        self._lock = asyncio.Lock()

    async def acquire(self):
        async with self._lock:
            now = time.monotonic()
            # Cộng token theo thời gian đã qua
            self._tokens = min(
                self._rate,
                self._tokens + (now - self._updated_at) * self._rate
            )
            self._updated_at = now
            if self._tokens < 1:
                wait = (1 - self._tokens) / self._rate
                await asyncio.sleep(wait)
                self._tokens = 0
            else:

def atomic_write_json(path: str | Path, data: dict):
